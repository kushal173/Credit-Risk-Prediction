services:
  credit-risk-api:
    build: .
    container_name: credit-risk-api
    restart: unless-stopped
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      MODEL_PATH: /app/credit1_risk_model.pkl
    ports:
      # Keep the API private to the host; Streamlit reaches it over the Compose network.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  credit-risk-app:
    build: .
    container_name: credit-risk-app
    restart: unless-stopped
    environment:
      CREDIT_RISK_API_URL: http://credit-risk-api:8000
      MODEL_THRESHOLD: "0.60"
    ports:
      - "8501:8501"
    depends_on:
      credit-risk-api:
        condition: service_healthy
